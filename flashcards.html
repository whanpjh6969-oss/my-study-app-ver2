<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->

</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">스마트 암기장</h1>
</div>
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant active:scale-95 transition-transform">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A clean, professional headshot of a student for a profile avatar. The background is a soft, solid light blue, maintaining the academic mentor aesthetic. The lighting is even and high-key, suitable for a modern corporate application design. The overall feel is trustworthy, focused, and scholarly." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsp39tLFy_Y-BwVftvFxA02mWZBsgA9yCqGGSpTEvBSoe8oF7M8T33y51wlo8BjlWgfTyFTiFkfg-1sofIrnm9zUOdNleHtFRI_45i_ivh7giILof1rmjNScccqbjI4G4taE1_CwXRpeTV8C_TkPvzXNcb0AXsPN4yVc7rJPfQMiUIbRRYs8rzLUhcwMJtx3PQT566eCRIDy_uI6lHFFkavG8cmQDvjDqfXra1CPskxZB4vTO98vn1wo1USG2JLfaHhWJSjq9OMFqD"/>

<main class="max-w-container-max mx-auto px-4 sm:px-gutter mt-base">

<section class="mb-md">
<div class="relative w-full">

<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none font-label-caps text-label-caps transition-all" placeholder="암기 카드 검색 또는 AI 사진 분석..." type="text"/>

<!-- Category Filters -->
<nav class="flex gap-2 overflow-x-auto pb-4 no-scrollbar">

<button class="px-5 py-2 rounded-full whitespace-nowrap bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-button text-button transition-all">일본어</button>
<button class="px-5 py-2 rounded-full whitespace-nowrap bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-button text-button transition-all">전공</button>

<!-- Flashcard List: Asymmetric Bento-like Layout -->

<!-- BottomNavBar -->

</a>

<span class="font-label-caps text-label-caps mt-1">Calendar</span>

<span class="font-label-caps text-label-caps mt-1">Flashcards</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-90 transition-all duration-200" href="members.html">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</a>
</nav>
<!-- Floating Action Button for Adding Flashcards (Contextually appropriate for this screen) -->
<div class="fixed right-6 bottom-24 z-40">
<a class="h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform px-4 inline-flex" href="ai-register.html"><div class="flex items-center gap-2 px-2"><span class="material-symbols-outlined text-[28px]">photo_camera</span><span class="font-button text-button">AI 사진으로 추가</span></div></a>
</div>
<script>
        // Simple filter button interaction
        const filterButtons = document.querySelectorAll('nav button');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('active-filter');
                    b.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                btn.classList.add('active-filter');
                btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
            });
        });
    </script>
<script>
  const STORAGE_KEY = 'study_flashcards';

  let flashcards = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (!flashcards) {
      flashcards = [];
  }

  const grid = document.getElementById('flashcard-grid');
  const searchInput = document.querySelector('input[type="text"]');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(flashcards));
  }

  function render(filter = '') {
    const filtered = flashcards.filter(f => f.title.toLowerCase().includes(filter.toLowerCase()));
    grid.innerHTML = '';
    
    if (filtered.length === 0 && filter === '') {
        grid.innerHTML = `
        <div class="col-span-full py-16 flex flex-col items-center justify-center text-center bg-surface-container-lowest rounded-xl border border-dashed border-outline-variant">
            <span class="material-symbols-outlined text-[64px] text-outline mb-4">photo_camera</span>
            <p class="font-body-lg text-body-lg text-on-surface-variant mb-6">등록된 암기장이 없습니다.<br>AI 사진 분석으로 첫 암기장을 만들어보세요!</p>
            <a href="ai-register.html" class="px-6 py-3 bg-primary text-on-primary font-button text-button rounded-full active:scale-95 transition-transform flex items-center gap-2">
                <span class="material-symbols-outlined">add</span>
                암기장 만들기
            </a>
        </div>
        `;
    } else {
        filtered.forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.className = 'group card-hover bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden transition-all duration-300 relative';
          cardEl.innerHTML = `
            <a href="detail.html?id=${card.id}" class="block h-full">
              <div class="relative h-48 overflow-hidden">
                <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${card.img}">
                <div class="absolute top-3 left-3">
                  <span class="bg-${card.categoryColor} text-${card.onCategoryColor} text-[10px] px-2 py-1 rounded-full font-label-caps">${card.category}</span>
                </div>
                <button onclick="event.preventDefault(); event.stopPropagation(); deleteCard(${card.id})" class="absolute top-3 right-3 bg-error text-on-error p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity hover:bg-error/90 active:scale-90 shadow-md z-10">
                  <span class="material-symbols-outlined text-[20px] leading-none">close</span>
                </button>
              </div>
              <div class="p-4">
                <h3 class="font-headline-md text-[20px] text-on-surface mb-2 line-clamp-1">${card.title}</h3>
                <div class="flex items-center justify-between mt-4">
                  <span class="text-on-surface-variant font-body-sm text-body-sm flex items-center gap-1">
                    <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                    ${card.date}
                  </span>
                  <span class="text-primary font-button text-button">${card.count}</span>
                </div>
              </div>
            </a>`;
          grid.appendChild(cardEl);
        });
        
        // Add Buttons
        const addButtonsHTML = `
          <a href="ai-register.html" class="group bg-surface-container-low border-2 border-dashed border-primary rounded-xl h-full flex flex-col items-center justify-center p-8 hover:bg-surface-container-high transition-all active:scale-95 min-h-[280px]">
              <span class="material-symbols-outlined text-[48px] text-primary">photo_camera</span>
              <span class="mt-4 font-button text-button text-primary">AI 사진 분석 등록</span>
              <span class="mt-1 text-[10px] font-label-caps text-on-surface-variant">사진을 찍으면 AI가 카드를 생성합니다</span>
          </a>
          <a href="ai-register.html" class="group bg-surface border-2 border-dashed border-outline-variant rounded-xl h-full flex flex-col items-center justify-center p-8 hover:bg-surface-container-low hover:border-primary transition-all active:scale-95 min-h-[280px]">
              <span class="material-symbols-outlined text-[48px] text-outline group-hover:text-primary transition-colors">add_circle</span>
              <span class="mt-4 font-button text-button text-on-surface-variant group-hover:text-primary">새 암기장 만들기</span>
          </a>
        `;
        grid.insertAdjacentHTML('beforeend', addButtonsHTML);
    }
  }

  window.deleteCard = (id) => {
    flashcards = flashcards.filter(f => f.id !== id);
    save();
    render(searchInput.value);
  };

  searchInput.addEventListener('input', (e) => render(e.target.value));

  // Initial render
  render();
</script></body></html>
