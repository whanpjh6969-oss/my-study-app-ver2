<!-- JavaScript Logic -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const calendarDays = document.getElementById('calendar-days');
        const calendarTitle = document.getElementById('calendar-title');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const noteDateDisplay = document.getElementById('note-date-display');
        const notesContainer = document.getElementById('notes-container');
        const newNoteInput = document.getElementById('new-note-input');
        const addNoteBtn = document.getElementById('add-note-btn');

        let currentDate = new Date();
        let viewYear = currentDate.getFullYear();
        let viewMonth = currentDate.getMonth();
        let selectedDateKey = formatDateKey(currentDate);

        // Dummy mock data for tasks to simulate schedules
        const taskMockData = {
            [`${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2, '0')}-05`]: true,
            [`${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2, '0')}-12`]: true,
            [`${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2, '0')}-25`]: true,
        };

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function renderCalendar() {
            calendarDays.innerHTML = '';
            
            const firstDayOfMonth = new Date(viewYear, viewMonth, 1).getDay();
            const lastDateOfMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            
            calendarTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
            
            // Empty slots before first day
            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'h-16';
                calendarDays.appendChild(emptyDiv);
            }

            for (let i = 1; i <= lastDateOfMonth; i++) {
                const currentIterationDate = new Date(viewYear, viewMonth, i);
                const dateKey = formatDateKey(currentIterationDate);
                const isSelected = dateKey === selectedDateKey;
                const hasTask = taskMockData[dateKey];
                
                const dayDiv = document.createElement('div');
                dayDiv.className = 'h-16 flex flex-col items-center justify-center relative group cursor-pointer active:scale-95 transition-all';
                dayDiv.dataset.dateKey = dateKey;

                let contentHtml = '';
                
                if (isSelected) {
                    contentHtml += `<div class="absolute inset-0 m-1 bg-primary rounded-xl"></div>
                                    <span class="text-on-primary relative z-10 font-bold">${i}</span>`;
                    if (hasTask) {
                        contentHtml += `<div class="w-1 h-1 bg-on-primary rounded-full mt-1 relative z-10"></div>`;
                    }
                } else {
                    contentHtml += `<div class="absolute inset-0 m-1 bg-primary rounded-xl opacity-0 group-hover:opacity-10 transition-opacity"></div>
                                    <span class="text-on-surface">${i}</span>`;
                    if (hasTask) {
                        contentHtml += `<div class="w-1 h-1 bg-secondary rounded-full mt-1"></div>`;
                    }
                }
                
                dayDiv.innerHTML = contentHtml;
                
                dayDiv.addEventListener('click', () => {
                    selectedDateKey = dateKey;
                    renderCalendar();
                    renderNotes();
                });

                calendarDays.appendChild(dayDiv);
            }
        }

        function renderNotes() {
            const dateObj = new Date(selectedDateKey);
            const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            noteDateDisplay.textContent = `${monthNames[dateObj.getMonth()]} ${String(dateObj.getDate()).padStart(2, '0')}`;
            
            notesContainer.innerHTML = '';
            const notesStr = localStorage.getItem(`notes_${selectedDateKey}`);
            let notes = notesStr ? JSON.parse(notesStr) : [];

            if (notes.length === 0) {
                notesContainer.innerHTML = `
                    <div class="border-2 border-dashed border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center text-center opacity-60 h-full">
                        <span class="material-symbols-outlined text-outline mb-2" data-icon="add_notes">add_notes</span>
                        <p class="text-on-surface-variant font-body-sm">새로운 메모를 작성하세요.</p>
                    </div>
                `;
            } else {
                notes.forEach(note => {
                    const noteEl = document.createElement('div');
                    noteEl.className = 'p-3 bg-surface-container-low rounded-lg border-l-4 border-primary transition-all hover:translate-x-1 mb-2';
                    noteEl.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-on-surface font-body-md">${note.text}</span>
                            <span class="text-xs text-on-surface-variant font-label-caps">${note.time}</span>
                        </div>
                    `;
                    notesContainer.appendChild(noteEl);
                });
            }
        }

        function addNote() {
            const text = newNoteInput.value.trim();
            if (!text) return;
            
            const now = new Date();
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const timeStr = `${String(hours).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} ${ampm}`;
            
            const notesStr = localStorage.getItem(`notes_${selectedDateKey}`);
            let notes = notesStr ? JSON.parse(notesStr) : [];
            notes.push({ text: text, time: timeStr });
            
            localStorage.setItem(`notes_${selectedDateKey}`, JSON.stringify(notes));
            newNoteInput.value = '';
            renderNotes();
        }

        prevMonthBtn.addEventListener('click', () => {
            viewMonth--;
            if (viewMonth < 0) {
                viewMonth = 11;
                viewYear--;
            }
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            viewMonth++;
            if (viewMonth > 11) {
                viewMonth = 0;
                viewYear++;
            }
            renderCalendar();
        });

        addNoteBtn.addEventListener('click', addNote);
        newNoteInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addNote();
        });

        // Initialize with default mock data for the current date just to show something initially if empty
        const initialMockNotes = [
            { text: "경제학 원론 복습", time: "09:00 AM", detail: "미시경제 파트 수요와 공급 곡선 그래프 연습하기." },
            { text: "영어 단어 50개 암기", time: "02:30 PM", detail: "TOEFL 빈출 단어 위주로 Flashcard 2회독 완료하기." }
        ];
        if(!localStorage.getItem(`notes_${selectedDateKey}`)) {
            localStorage.setItem(`notes_${selectedDateKey}`, JSON.stringify(initialMockNotes));
        }

        renderCalendar();
        renderNotes();
    });
</script>
